services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hrsync
      POSTGRES_USER: hrsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrsync -d hrsync"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - hrsync-pg:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.2
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_HEAP_OPTS: -Xmx256M -Xms256M
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      HR_SYNC_KAFKA_TOPIC: ${HR_SYNC_KAFKA_TOPIC:-hr-sync.employee-changes}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$HR_SYNC_KAFKA_TOPIC" --partitions 6 --replication-factor 1
    restart: "no"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hrsync
      SPRING_DATASOURCE_USERNAME: hrsync
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HR_SYNC_JWT_SECRET: ${HR_SYNC_JWT_SECRET:?Set HR_SYNC_JWT_SECRET in .env}
      HR_SYNC_BOOTSTRAP_OPERATOR_USERNAME: ${HR_SYNC_BOOTSTRAP_OPERATOR_USERNAME:?Set HR_SYNC_BOOTSTRAP_OPERATOR_USERNAME in .env}
      HR_SYNC_BOOTSTRAP_OPERATOR_PASSWORD: ${HR_SYNC_BOOTSTRAP_OPERATOR_PASSWORD:?Set HR_SYNC_BOOTSTRAP_OPERATOR_PASSWORD in .env}
      HR_SYNC_BOOTSTRAP_ADMIN_USERNAME: ${HR_SYNC_BOOTSTRAP_ADMIN_USERNAME:?Set HR_SYNC_BOOTSTRAP_ADMIN_USERNAME in .env}
      HR_SYNC_BOOTSTRAP_ADMIN_PASSWORD: ${HR_SYNC_BOOTSTRAP_ADMIN_PASSWORD:?Set HR_SYNC_BOOTSTRAP_ADMIN_PASSWORD in .env}
      HR_SYNC_BOOTSTRAP_ADMIN_TENANT: ${HR_SYNC_BOOTSTRAP_ADMIN_TENANT:?Set HR_SYNC_BOOTSTRAP_ADMIN_TENANT in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      HR_SYNC_PUBLISHER: ${HR_SYNC_PUBLISHER:-kafka}
      HR_SYNC_KAFKA_BOOTSTRAP_SERVERS: ${HR_SYNC_KAFKA_BOOTSTRAP_SERVERS:-kafka:19092}
      HR_SYNC_KAFKA_TOPIC: ${HR_SYNC_KAFKA_TOPIC:-hr-sync.employee-changes}
    ports:
      - "8080:8080"
    stop_grace_period: 30s

volumes:
  hrsync-pg:
