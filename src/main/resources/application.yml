spring:
  application:
    name: hr-sync
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hrsync}
    username: ${SPRING_DATASOURCE_USERNAME:hrsync}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    max-http-form-post-size: -1
    max-swallow-size: -1

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    prometheus:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - prometheus

logging:
  structured:
    format:
      console: logstash
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

hr-sync:
  ingest:
    max-batch-size: 1000
    max-body-bytes: 1048576
  publisher: ${HR_SYNC_PUBLISHER:logging}
  kafka:
    bootstrap-servers: ${HR_SYNC_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${HR_SYNC_KAFKA_TOPIC:hr-sync.employee-changes}
    partitions: 6
    replication-factor: 1
    max-block: 1s
    delivery-timeout: 3s
    request-timeout: 1500ms
    linger: 1ms
    batch-size: 65536
    compression: lz4
    circuit-base: 200ms
    circuit-max: 30s
  outbox:
    poll-interval: 1s
    batch-size: 400
    employee-cap: 100
    publisher-threads: 1
    tick-budget: 3s
    max-attempts: 5
    retry-base: 500ms
    retry-max-delay: 30s
    shutdown-timeout: 20s
  auth:
    jwt-secret: ${HR_SYNC_JWT_SECRET:}
    token-ttl: 15m
    max-login-failures: 5
    login-lockout: 15m
  metrics:
    sample-interval: 10s
  database:
    connection-timeout: 3s
    statement-timeout: 3s
    retry-after: 3s
  cache:
    office-maximum-size: 10000
    office-ttl: 60s
    employee-maximum-size: 10000
    employee-ttl: 10s
  bootstrap:
    operator-username: ${HR_SYNC_BOOTSTRAP_OPERATOR_USERNAME:}
    operator-password: ${HR_SYNC_BOOTSTRAP_OPERATOR_PASSWORD:}
    admin-username: ${HR_SYNC_BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${HR_SYNC_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-tenant: ${HR_SYNC_BOOTSTRAP_ADMIN_TENANT:}
  reconciliation:
    bucket-count: 256
    max-missing-ratio: 0.30
  retention:
    age: 30d
    batch-size: 1000
    interval: 1h
