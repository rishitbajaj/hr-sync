spring:
  application:
    name: hr-sync
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hrsync}
    username: ${SPRING_DATASOURCE_USERNAME:hrsync}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: -1
    max-swallow-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn

hr-sync:
  ingest:
    max-batch-size: 1000
    max-body-bytes: 1048576
  outbox:
    poll-interval: 1s
    batch-size: 100
    max-attempts: 5
    retry-base: 500ms
    retry-max-delay: 30s
  auth:
    jwt-secret: ${HR_SYNC_JWT_SECRET:}
    token-ttl: 15m
    max-login-failures: 5
    login-lockout: 15m
  reconciliation:
    bucket-count: 256
    max-missing-ratio: 0.30
  retention:
    age: 30d
    batch-size: 1000
    interval: 1h
