spring:
  task:
    scheduling:
      enabled: false

logging:
  structured:
    format:
      console: logstash

management:
  endpoint:
    prometheus:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - prometheus

hr-sync:
  publisher: logging
  auth:
    jwt-secret: 0123456789abcdef0123456789abcdef
  metrics:
    sample-interval: 1h
  database:
    connection-timeout: 30s
    statement-timeout: 120s
    retry-after: 3s
  outbox:
    poll-interval: 1h
    batch-size: 20
    publisher-threads: 1
    max-attempts: 3
    retry-base: 0ms
    retry-max-delay: 0ms
