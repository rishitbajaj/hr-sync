spring:
  task:
    scheduling:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

hr-sync:
  auth:
    jwt-secret: 0123456789abcdef0123456789abcdef
  outbox:
    poll-interval: 1h
    batch-size: 20
    max-attempts: 3
    retry-base: 0ms
    retry-max-delay: 0ms
